name: Check published blocklists
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Update Safeguard']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python scripts/check_updates.py --attempts 10
