name: Update Safeguard
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'sources.json', 'rules/**', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: safeguard-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
      - name: Publish validated lists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocklists sources
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated Safeguard blocklists'
            git push
          fi
