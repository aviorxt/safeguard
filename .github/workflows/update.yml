name: Update Safeguard
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'sources.json', 'catalog.json', 'rules/**', '.github/workflows/update.yml']
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: safeguard-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
      - run: python scripts/build_site.py
      - name: Publish validated lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_update.py
