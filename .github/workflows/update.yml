name: Update Safeguard
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'sources.json', 'catalog.json', 'rules/**', '.github/workflows/update.yml']
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: safeguard-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
      - run: python scripts/build_site.py
      - name: Publish validated lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_update.py
