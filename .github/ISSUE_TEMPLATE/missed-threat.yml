{
  "name": "Missed threat",
  "description": "Report an unblocked threat domain.",
  "title": "[Threat]: ",
  "body": [
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I searched existing issues and included no credentials, private client IDs, personal browsing URLs or private logs.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "input",
      "id": "domain",
      "attributes": {
        "label": "Domain",
        "description": "Domain only. Do not link directly to malware downloads."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "category",
      "attributes": {
        "label": "Threat type and evidence",
        "description": "Explain malware, phishing, scam or mining evidence. Prefer public reputation reports, not direct payload links."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "profile",
      "attributes": {
        "label": "Subscription, date and resolver",
        "description": "List URL/profile, last refresh time and resolver/version."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduce",
      "attributes": {
        "label": "Observed behavior",
        "description": "Describe how you confirmed the domain is not filtered. Do not open suspicious URLs to test."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
