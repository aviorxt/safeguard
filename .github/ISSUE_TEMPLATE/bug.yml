{
  "name": "Bug report",
  "description": "Report a builder, format, website or update failure.",
  "title": "[Bug]: ",
  "body": [
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I searched existing issues and included no credentials, private client IDs, personal browsing URLs or private logs.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "textarea",
      "id": "summary",
      "attributes": {
        "label": "What went wrong?",
        "description": "Expected vs actual behavior."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduce",
      "attributes": {
        "label": "Reproduction steps",
        "description": "Steps, resolver/version, subscription URL, format, OS/browser if relevant."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Public evidence",
        "description": "Public failing workflow URL, sanitized error, affected commit and last successful update."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "impact",
      "attributes": {
        "label": "Impact and workaround",
        "description": "Who is affected? Does another format or previous revision work?"
      },
      "validations": {
        "required": false
      }
    }
  ]
}
