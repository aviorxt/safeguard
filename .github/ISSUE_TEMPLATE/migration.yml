{
  "name": "Migration request",
  "description": "Plan a repository, subscription, format or source migration.",
  "title": "[Migration]: ",
  "body": [
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I searched existing issues and included no credentials, private client IDs, personal browsing URLs or private logs.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "textarea",
      "id": "from",
      "attributes": {
        "label": "Current setup",
        "description": "Public repository/list URL, current resolver/version and format. No credentials."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "to",
      "attributes": {
        "label": "Requested destination",
        "description": "New public repository/list URL, resolver or format. Who controls the destination?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "changes",
      "attributes": {
        "label": "What changes and why?",
        "description": "Before/after behavior, affected categories, breaking changes, licensing/attribution and reason for migration."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "plan",
      "attributes": {
        "label": "Migration and verification plan",
        "description": "Steps, URL mappings/redirects, coexistence period, timing, tests and acceptance criteria."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "rollback",
      "attributes": {
        "label": "Rollback plan",
        "description": "How can users revert? Identify old subscription URLs to preserve and any required user action."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
